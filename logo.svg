<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Background transparent -->
  
  <!-- T letter -->
  <rect x="10" y="20" width="80" height="22" rx="5" fill="#1a1a1a"/>
  <rect x="36" y="20" width="28" height="100" rx="5" fill="#1a1a1a"/>
  
  <!-- E letter (with yellow middle bar) -->
  <rect x="115" y="20" width="80" height="22" rx="5" fill="#1a1a1a"/>
  <rect x="115" y="20" width="22" height="100" rx="5" fill="#1a1a1a"/>
  <rect x="115" y="58" width="65" height="18" rx="4" fill="#F5A623"/>
  <rect x="115" y="98" width="80" height="22" rx="5" fill="#1a1a1a"/>
  
  <!-- R letter -->
  <rect x="220" y="20" width="22" height="100" rx="5" fill="#1a1a1a"/>
  <rect x="220" y="20" width="70" height="22" rx="5" fill="#1a1a1a"/>
  <rect x="265" y="20" width="22" height="55" rx="5" fill="#1a1a1a"/>
  <rect x="220" y="58" width="68" height="18" rx="4" fill="#1a1a1a"/>
  <rect x="248" y="75" width="48" height="45" rx="5" fill="#1a1a1a" transform="skewX(-8)"/>
  
  <!-- L letter -->
  <rect x="325" y="20" width="22" height="100" rx="5" fill="#1a1a1a"/>
  <rect x="325" y="98" width="65" height="22" rx="5" fill="#1a1a1a"/>
  
  <!-- WEB STUDIO text -->
  <text x="200" y="148" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="22" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="6">WEB STUDIO</text>
  
  <!-- Tagline -->
  <text x="200" y="175" font-family="'Arial', 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" fill="#F5A623" text-anchor="middle" letter-spacing="3">&lt;</text>
  <text x="200" y="175" font-family="'Arial', 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle" letter-spacing="3"> GROWTH YOUR BRANDING </text>
  <text x="200" y="175" font-family="'Arial', 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" fill="#F5A623" text-anchor="end" letter-spacing="3">&gt;</text>
</svg>
